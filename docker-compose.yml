x-backend-image: &backend-image
  build: ./backend
  image: clearnews-backend
  env_file:
    - ./backend/.env
  environment:
    DATABASE_URL: postgresql+psycopg://clearnews:clearnews@db:5432/clearnews
    REDIS_URL: redis://:${REDIS_PASSWORD:-clearnews-dev-redis-change-me}@valkey:6379/0
    # Self-hosted default for the live-web agent tool. Override WEB_SEARCH_PROVIDER
    # plus a key only when deliberately opting into Tavily or Brave.
    WEB_SEARCH_PROVIDER: searxng
    SEARXNG_URL: http://searxng:8080
  depends_on:
    db:
      condition: service_healthy
    valkey:
      condition: service_healthy
  # Healthcheck shared by backend, scheduler, and any future services that
  # depend on the API being reachable. The /docs endpoint is lightweight and
  # guaranteed to exist on every FastAPI instance.
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
    interval: 30s
    timeout: 5s
    start_period: 60s  # give torch/spaCy models time to load on first boot
    retries: 5

services:
  valkey:
    image: valkey/valkey:8-alpine
    # --requirepass: valkey has no auth by default, but this instance holds
    # session tokens (app/cache.py's session_key) and the NLP work queue, so
    # it needs the same treatment as db below. --appendonly: persist the NLP
    # queue and cache across restarts instead of dropping it silently.
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:-clearnews-dev-redis-change-me}", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    # Remove this port mapping in production - it exposes valkey to the host.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-clearnews-dev-redis-change-me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg17
    # Override POSTGRES_PASSWORD via .env or environment for real deployments.
    environment:
      POSTGRES_DB: clearnews
      POSTGRES_USER: clearnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearnews}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Remove this port mapping in production - it exposes the DB to the host.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearnews"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-image
    ports:
      - "8000:8000"

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      # Dev default so `docker compose up` works with no extra setup; override
      # in a real deployment (any random string - only used to sign sessions).
      SEARXNG_SECRET: ${SEARXNG_SECRET:-clearnews-dev-searxng-secret-change-me}
    volumes:
      # Turns on the JSON API the web_search tool needs (off by default) -
      # see searxng/settings.yml. Not read-only: the image's entrypoint
      # substitutes the secret_key placeholder in place on container start.
      - ./searxng/settings.yml:/etc/searxng/settings.yml
      - searxng-data:/etc/searxng
    ports:
      - "8080:8080"

  # ingestion, NLP, clustering, nightly metrics/death-risk - see pipeline/scheduler.py
  scheduler:
    <<: *backend-image
    command: ["python", "-m", "pipeline.scheduler"]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    # Wait for backend healthcheck before starting nginx - prevents serving
    # stale error pages while the API is still booting.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  searxng-data:
  valkeydata:
