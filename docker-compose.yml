x-backend-image: &backend-image
  build: ./backend
  image: clearnews-backend
  env_file:
    - ./backend/.env
  environment:
    DATABASE_URL: postgresql+psycopg://clearnews:clearnews@db:5432/clearnews
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: clearnews
      POSTGRES_USER: clearnews
      POSTGRES_PASSWORD: clearnews
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearnews"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-image
    ports:
      - "8000:8000"

  # ingestion, NLP, clustering, nightly metrics/death-risk - see pipeline/scheduler.py
  scheduler:
    <<: *backend-image
    command: ["python", "-m", "pipeline.scheduler"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
