[project]
name = "clearnews-backend"
version = "0.1.0"
description = "ClearNews - news story lifecycle & narrative drift intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.14",
    "vadersentiment>=3.3.2",
    "transformers>=5.12.1",
    "torch>=2.12.1",
    "en-core-web-sm",
    "hdbscan>=0.8.44",
    "scikit-learn>=1.9.0",
    "numpy>=1.26,<2.4",
    "langgraph>=1.2.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.1.0",
    "umap-learn>=0.5.12",
    "xgboost>=3.3.0",
    "numba>=0.60",
    "trafilatura>=2.1.0",
    "argon2-cffi>=23.1",
    "shap>=0.48",
    "alembic>=1.18.5",
    "faster-whisper>=1.1",
    "kokoro==0.7.16",
    "misaki==0.7.4",
    "soundfile>=0.12",
    "phonemizer>=3.2",
    "num2words>=0.5",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real_model'"
markers = [
    "dev_db: needs a populated dev database with clustered stories (run the pipeline first)",
    "real_model: downloads and runs real STT/TTS models (multi-hundred-MB, opt-in only, not run in CI)",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

# Kokoro's published metadata hard-pins numpy==1.26.4, which conflicts with
# this project's numpy>=1.26,<2.4 (needed for torch/transformers/etc). This
# override replaces Kokoro's declared requires-dist with the same list minus
# the numpy pin, so uv's resolver can pick a numpy version that satisfies
# everyone. Validated by the real (non-mocked) smoke test in
# tests/test_voice_deps.py (`uv run pytest -m real_model tests/test_voice_deps.py`),
# which loads Kokoro for real and confirms it still synthesizes audio under
# the resolved numpy version - do not delete this override without re-running
# that test against whatever numpy version you'd move to.
[[tool.uv.dependency-metadata]]
name = "kokoro"
version = "0.7.16"
requires-dist = ["huggingface-hub", "loguru", "misaki>=0.7.4", "scipy", "torch", "transformers"]
