[project]
name = "clearnews-backend"
version = "0.1.0"
description = "ClearNews - news story lifecycle & narrative drift intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
