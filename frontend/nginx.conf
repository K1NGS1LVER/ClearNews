server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";  # keepalive for upstream
        proxy_http_version 1.1;
    }

    # SSE chat stream: disable buffering so tokens flush as they arrive.
    # Connection "" + http_version 1.1 enables keep-alive for the long-lived
    # SSE connection. chunked_transfer_encoding off prevents nginx from
    # buffering the entire response before forwarding.
    location /api/chat {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri /index.html;
    }
}
