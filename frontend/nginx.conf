server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";  # keepalive for upstream
        proxy_http_version 1.1;
    }

    # SSE chat stream: disable buffering so tokens flush as they arrive.
    # Connection "" + http_version 1.1 enables keep-alive for the long-lived
    # SSE connection. chunked_transfer_encoding off prevents nginx from
    # buffering the entire response before forwarding.
    location /api/chat {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # TTS audio stream: same reasoning as /api/chat above - Kokoro produces
    # audio chunk-by-chunk per sentence, and buffering here would defeat the
    # point of streaming it (the client wouldn't get audio until the whole
    # answer's speech had synthesized).
    location /api/voice/speak {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding off;
    }

    # Voice clip upload: raise the body size cap to match the backend's own
    # MAX_UPLOAD_BYTES (app/main.py) - nginx's 1m default is tighter than
    # what the backend already accepts, so it would reject valid uploads
    # before they ever reach it. A one-shot upload, not a stream, so none of
    # the buffering-off settings above are needed here.
    location /api/voice/transcribe {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 120s;  # same headroom as the other model-backed endpoints
        client_max_body_size 10m;
    }

    location / {
        try_files $uri /index.html;
    }
}
